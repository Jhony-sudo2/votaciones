services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Primero crea .env con scripts/iniciar.sh o iniciar.ps1}
      MYSQL_DATABASE: sistema_votacion
      MYSQL_USER: votacion_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Debes configurar DB_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 25s
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: sistema_votacion
      DB_USER: votacion_user
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/var/www/html/storage/uploads
    networks: [internal]

volumes:
  db_data:
  uploads_data:

networks:
  internal:
    driver: bridge
