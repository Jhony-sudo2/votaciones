expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.upload_progress.enabled = 0
file_uploads = On
upload_max_filesize = 5M
post_max_size = 7M
max_file_uploads = 2
memory_limit = 128M
allow_url_include = Off
